name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Сборка (windows)
    runs-on: windows-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Восстановление пакетов
        run: dotnet restore

      - name: Сборка
        run: dotnet build --configuration Release --no-restore

      - name: Проверка публикации
        run: >
          dotnet publish --configuration Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true --no-build --output out

      - name: Иконка
        run: powershell -ExecutionPolicy Bypass -File tools/make-icon.ps1

      - name: Артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: CopyPush-win-x64
          path: out/CopyPush.exe
          if-no-files-found: error
