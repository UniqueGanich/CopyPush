name: Release

# Релиз создаётся при пуше тега вида v1.0.0
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Сборка и публикация релиза
    runs-on: windows-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Версия
        id: ver
        shell: pwsh
        run: |
          $tag = if ("${{ github.event.inputs.tag }}") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          $v = $tag -replace '^v', ''
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Сборка self-contained (не требует .NET)
        run: >
          dotnet publish --configuration Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=none
          -o dist/self-contained

      - name: Сборка framework-dependent (нужен .NET 8 Desktop Runtime)
        run: >
          dotnet publish --configuration Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -p:DebugType=none
          -o dist/framework-dependent

      - name: Иконка
        run: powershell -ExecutionPolicy Bypass -File tools/make-icon.ps1

      - name: Упаковка архивов
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          $tag = "${{ steps.ver.outputs.tag }}"

          New-Item -ItemType Directory -Force -Path release | Out-Null

          # --- self-contained: работает на любой Windows 10/11 без предустановок ---
          $sc = "release/CopyPush-$v-win-x64"
          New-Item -ItemType Directory -Force -Path $sc | Out-Null
          Copy-Item dist/self-contained/CopyPush.exe $sc
          Copy-Item tools/Uninstall.cmd $sc
          Copy-Item README.md $sc
          Copy-Item LICENSE $sc
          Compress-Archive -Path "$sc/*" -DestinationPath "release/CopyPush-$v-win-x64.zip"

          # --- framework-dependent: ~24 МБ, требуется .NET 8 Desktop Runtime ---
          $fw = "release/CopyPush-$v-win-x64-small"
          New-Item -ItemType Directory -Force -Path $fw | Out-Null
          Copy-Item dist/framework-dependent/CopyPush.exe $fw
          Copy-Item tools/Uninstall.cmd $fw
          Copy-Item README.md $fw
          Copy-Item LICENSE $fw
          Compress-Archive -Path "$fw/*" -DestinationPath "release/CopyPush-$v-win-x64-small.zip"

          Get-ChildItem release -Filter *.zip | ForEach-Object { "{0}  {1:N1} МБ" -f $_.Name, ($_.Length/1MB) }

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: CopyPush ${{ steps.ver.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: RELEASE_NOTES.md
          files: |
            release/*.zip

      - name: Исходники релиза
        uses: actions/upload-artifact@v4
        with:
          name: CopyPush-source-${{ steps.ver.outputs.version }}
          path: |
            dist/
            release/
          if-no-files-found: error
