name: Release

# Релиз создаётся при пуше тега вида v1.0.0
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например v1.0.0)'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Сборка и публикация релиза
    runs-on: windows-latest

    steps:
      - name: Получить исходники
        uses: actions/checkout@v4

      - name: Установить .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Версия
        id: ver
        shell: pwsh
        run: |
          $tag = if ("${{ github.event.inputs.tag }}") { "${{ github.event.inputs.tag }}" } else { "${{ github.ref_name }}" }
          $v = $tag -replace '^v', ''
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Иконка
        run: powershell -ExecutionPolicy Bypass -File tools/make-icon.ps1

      - name: Сборка и упаковка архивов
        shell: pwsh
        run: |
          $v = "${{ steps.ver.outputs.version }}"
          ./tools/pack-release.ps1 -Version $v
          Get-ChildItem release -Filter *.zip | ForEach-Object { "{0}  {1:N1} МБ" -f $_.Name, ($_.Length/1MB) }

      - name: Опубликовать релиз
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: CopyPush ${{ steps.ver.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: RELEASE_NOTES.md
          files: |
            release/*.zip

      - name: Исходники релиза
        uses: actions/upload-artifact@v4
        with:
          name: CopyPush-source-${{ steps.ver.outputs.version }}
          path: |
            dist/
            release/
          if-no-files-found: error
